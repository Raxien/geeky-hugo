# Mappa "menu Destinazioni -> dove deve puntare il link", una sezione per
# lingua perché i post IT ed EN usano stringhe paese diverse e non condivise
# (Params.country: "Giappone" vs "Japan"), non essendo "country" una vera
# taxonomy Hugo (solo un campo di front matter).
#
# hub: presente solo per i paesi promossi a pagina hub dedicata
#   (content/<lang>/destinazioni/<hub>.md + layouts/destinazioni/single.html).
#   Aggiungere un paese qui è l'intero meccanismo di promozione: nessuna
#   modifica ai template è necessaria oltre a creare il relativo content file.
# fallback_category_slug: slug esatto della macro-categoria consolidata
#   (/categories/<slug>/) usata come destinazione per tutti i paesi senza hub.
#   Non deriva dal continente: alcuni paesi europei (Balcani) hanno una
#   categoria propria diversa da "Europa in Camper".

it:
  Giappone:
    hub: giappone
    fallback_category_slug: giappone-in-camper
