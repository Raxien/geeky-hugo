[build]
  publish = "public"
  # npm install (non "ci": package-lock.json è in .gitignore, quindi non c'è un lockfile
  # da cui "ci" possa installare): postcss/postcss-cli/@fullhuman/postcss-purgecss (vedi
  # package.json), necessari a Hugo per lo step css.PostCSS in style.html (PurgeCSS).
  command = "npm install && npx --yes terser assets/js/script.js -o assets/js/script.min.js -c passes=2,pure_getters,unsafe,unsafe_math,unsafe_proto,unsafe_regexp,unsafe_undefined,conditionals,dead_code,evaluate,booleans,loops,unused,drop_console=true,drop_debugger=true -m --comments '/^!/' && hugo --minify --gc && cat static/_redirects netlify-host-redirects > public/_redirects && cp 404-fallback.html public/404.html"
  
[build.environment]
  HUGO_VERSION = "0.163.3"

[[headers]]
  for = "/*" # This defines which paths this specific [[headers]] block will cover.

[headers.values]
  X-Frame-Options = "DENY"
  X-XSS-Protection = "1; mode=block"
  Referrer-Policy = "same-origin"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/sddefault_*.webp" # Miniature YouTube self-hosted in fase di build (vedi shortcode youtube2)

[headers.values]
  # 1 anno: sono video propri, la miniatura non cambia in pratica (vedi commento
  # in youtube2.html). PageSpeed segnalava "durata cache inefficiente" sui 7gg precedenti.
  Cache-Control = "public, max-age=31536000"

# CSS/JS con nome fingerprintato (hash sha512 nel filename via resources.fingerprint in
# style.html/script.html): il contenuto cambia solo quando cambia l'hash, quindi possono
# restare in cache "immutable" per un anno senza rischio di servire una versione stale.
# Pattern ristretto a main.*.css/bundle.*.js (non "/css/*" o "/js/*" generici) perché
# js/search.<lang>.js NON è fingerprintato: stesso nome ad ogni build, andrebbe stale
# in cache per un anno ad ogni aggiornamento delle traduzioni.
[[headers]]
  for = "/css/main.*.css"

[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/bundle.*.js"

[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Proxy per la miniatura del widget "Ultimi Vlog" (l'ultimo video pubblicato, non noto in fase di
# build): serve via Edge Function (netlify/edge-functions/yt-thumb.js) invece di un semplice
# redirect, perché un redirect status=200 lascia passare intatto il Cache-Control originale di
# YouTube (max-age=7200, 2h) senza che le [[headers]] qui sotto possano sovrascriverlo - quella
# regola si applica solo ai file serviti direttamente da Netlify, non alle risposte di un redirect
# proxy verso un'origine esterna. La Edge Function fa il fetch esplicitamente e può quindi
# impostare l'header lei stessa (vedi yt-thumb.js): max-age=31536000 (1 anno), risparmio di
# richieste privilegiato rispetto alla freschezza, dato che le miniature non cambiano mai in pratica.
[[edge_functions]]
  path = "/yt-thumb/:size/:id"
  function = "yt-thumb"

# Custom 404 per dominio (vedi netlify/edge-functions/custom-404.js per il perché non basta il
# rewrite forzato in netlify-host-redirects + il public/404.html di fallback).
[[edge_functions]]
  path = "/*"
  function = "custom-404"