# Configurazione Sveltia CMS per Vandipety.
# Documentazione: https://sveltiacms.app/en/docs
#
# ATTENZIONE — passi manuali OBBLIGATORI fuori da questo repo prima che /admin/ funzioni,
# vedi exampleSite/static/admin/SETUP.md per la procedura completa passo-passo:
#   1. Creare una GitHub OAuth App con callback verso Netlify e registrarne
#      client id/secret nelle impostazioni del sito Netlify (Access control > OAuth).
#      (Stesso identico meccanismo di Decap: Sveltia è compatibile con lo stesso proxy.)
#   2. Sostituire API_KEY_DA_SOSTITUIRE qui sotto con l'API Key del tuo account
#      Cloudinary (console.cloudinary.com, in alto nella dashboard — NON l'API Secret,
#      quella non va mai messa qui). cloud_name è già impostato: compare in chiaro nelle
#      URL immagine già presenti nel sito e in carousel.html, non è un dato segreto.
# Senza questi due passi la pagina si carica ma il login e l'upload cover non funzionano.

backend:
  name: github
  repo: Raxien/geeky-hugo # intero repository: contiene sia il tema che exampleSite
  branch: master

# Pubblica direttamente su master ad ogni salvataggio (niente PR di revisione).
# È sicuro perché i nuovi articoli nascono con draft: true (vedi collections sotto):
# Hugo non li pubblica finché non si toglie manualmente la spunta "Bozza".
publish_mode: simple

media_folder: 'exampleSite/static/uploads' # fallback per file NON caricati su Cloudinary
public_folder: '/uploads'

# Cloudinary è nativo in Sveltia (a differenza di Decap non serve un secondo script):
# apre la vera Media Library Cloudinary, login con l'account già in uso per il sito.
media_library:
  name: cloudinary
  config:
    cloud_name: ilgattodicitturin
    api_key: API_KEY_DA_SOSTITUIRE
    output_filename_only: false

# Niente "locale: it" qui: su Sveltia quella chiave non è supportata (era per l'UI di
# Decap, non per il contenuto) e genera solo un avviso in console — vedi note su Decap.

# Nota per il futuro: Sveltia ha un supporto i18n di prima classe (file di lingua diversi
# come "varianti" di uno stesso contenuto), ma qui IT e EN sono due cartelle Hugo separate
# (content/it/blog, content/en/blog) — non il pattern "un file, più lingue" che quella
# funzionalità si aspetta. Per ora restano due collection distinte, come su Decap.

collections:
  - name: 'blog_it'
    label: '🇮🇹 Blog — Italiano'
    label_singular: 'Nuovo articolo (IT)'
    description: 'Articoli in italiano — content/it/blog. "Articolo" qui = lingua italiana, non un tipo di contenuto diverso da "Post" in Blog English.'
    folder: 'exampleSite/content/it/blog'
    create: true
    slug: '{{slug}}' # nome file generato dal titolo — non è il campo "Slug URL" qui sotto
    extension: 'md'
    format: 'frontmatter'
    sortable_fields: ['date', 'title']
    fields:
      - { label: 'Titolo', name: 'title', widget: 'string' }
      - { label: 'Descrizione (SEO, ~155 caratteri)', name: 'description', widget: 'text' }
      - label: 'Copertina'
        name: 'image'
        widget: 'image'
        media_library:
          config:
            folder: 'articoli' # cartella Cloudinary suggerita per le nuove cover
      - { label: 'Data pubblicazione', name: 'date', widget: 'datetime', default: '{{now}}' }
      - label: 'Categorie'
        name: 'categories'
        widget: 'list'
        field: { label: 'Categoria', name: 'category', widget: 'string' }
      - { label: 'Continente', name: 'continent', widget: 'string', required: false }
      - { label: 'Paese', name: 'country', widget: 'string', required: false }
      - label: 'Tipo'
        name: 'type'
        widget: 'select'
        options: ['regular', 'featured']
        default: 'regular'
      # ⚠️ Osservato in test: su un file con draft:true già salvato, dopo un giro nell'editor
      # la riga "draft:" è sparita dal file (non diventata false: proprio assente). Non ho
      # trovato nella documentazione di Sveltia un meccanismo che lo spieghi (dicono di non
      # omettere mai valori booleani). Da verificare con un salvataggio "pulito" prima di
      # fidarsi: se un articolo bozza dopo un salvataggio esce da questo stato, è un bug da
      # segnalare a monte, non qualcosa che possiamo aggiustare da config.yml.
      - { label: 'Bozza (non pubblicato finché spuntato)', name: 'draft', widget: 'boolean', default: true }
      # slug/language: presenti solo in ALCUNI file esistenti (2 file IT, l'intero blog EN).
      # Dichiarati qui SOLO per non farli sparire in salvataggio — vedi nota nel branch:
      # senza questi due campi, salvare un file che li aveva li cancella silenziosamente
      # (Decap/Sveltia ricostruiscono il frontmatter solo dai campi dichiarati).
      - {
          label: 'Slug URL personalizzato (override — lascia vuoto se non serve)',
          name: 'slug',
          widget: 'string',
          required: false,
        }
      - { label: 'Language (campo legacy, non risulta usato dal tema)', name: 'language', widget: 'string', required: false }
      - label: 'Contenuto'
        name: 'body'
        widget: 'markdown'
        editor_components:
          - image-shortcode
          - extlink-shortcode
          - youtube-shortcode
          - button-shortcode
          - carousel-shortcode
          - indice-shortcode
          - gmap-shortcode
          - leggianche-blog_it-shortcode

  - name: 'blog_en'
    label: '🇬🇧 Blog — English'
    label_singular: 'New post (EN)'
    description: 'English posts — content/en/blog. "Post" here just means English language, same content type as "Articolo" in Blog Italiano.'
    folder: 'exampleSite/content/en/blog'
    create: true
    slug: '{{slug}}' # nome file generato dal titolo — non è il campo "Slug URL" qui sotto
    extension: 'md'
    format: 'frontmatter'
    sortable_fields: ['date', 'title']
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Description (SEO)', name: 'description', widget: 'text' }
      - label: 'Cover'
        name: 'image'
        widget: 'image'
        media_library:
          config:
            folder: 'articoli'
      - { label: 'Publish date', name: 'date', widget: 'datetime', default: '{{now}}' }
      - label: 'Categories'
        name: 'categories'
        widget: 'list'
        field: { label: 'Category', name: 'category', widget: 'string' }
      - { label: 'Continent', name: 'continent', widget: 'string', required: false }
      - { label: 'Country', name: 'country', widget: 'string', required: false }
      - label: 'Type'
        name: 'type'
        widget: 'select'
        options: ['regular', 'featured']
        default: 'regular'
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: true }
      # Quasi tutti i file EN hanno questi due campi (slug per URL inglese pulito, es.
      # "morocco-by-campervan-complete-guide" anche se il file si chiama in italiano).
      # Dichiarati per evitare che sparire in salvataggio (vedi stessa nota su blog_it).
      - {
          label: 'Custom URL slug (override — leave empty if not needed)',
          name: 'slug',
          widget: 'string',
          required: false,
        }
      - { label: 'Language (legacy field, does not look used by the theme)', name: 'language', widget: 'string', required: false }
      - label: 'Content'
        name: 'body'
        widget: 'markdown'
        editor_components:
          - image-shortcode
          - extlink-shortcode
          - youtube-shortcode
          - button-shortcode
          - carousel-shortcode
          - indice-shortcode
          - gmap-shortcode
          - leggianche-blog_en-shortcode
